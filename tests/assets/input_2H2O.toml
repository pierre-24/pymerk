# This is a minimalistic workflow with small basis sets, just to test

[general]
evaluate_rrho = true
sm_rrho = 'alpb'
solvent = 'water'

[prescreening]
prog = 'vlx'
func = 'pbe'
basis = 'def2-sv(p)'

[screening]
prog = 'vlx'
func = 'pbe'
basis = 'def2-svp'
gsolv_included = false

[optimization]
prog = 'vlx'
func = 'pbe'
basis = 'def2-svp'
sm = 'cpcm'
alternate_solvent = 80.0
optlevel = 'loose'  # lower criterions to speed up

[refinement]
prog = 'vlx'
func = 'rcam-b3lyp'
basis = 'def2-svp'
sm = 'smd'
gsolv_included = true

[paths]
xtb = 'xtb'
vlx = 'vlx'
